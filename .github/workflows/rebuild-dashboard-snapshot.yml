name: Rebuild Dashboard Snapshot (nightly Layer 3)

# PR 1 (2026-05-20) — Layer 3 reconciliation for the dashboard_snapshot
# table. Runs once a day, in the small hours of SGT, to invalidate
# every tenant's snapshot row. The next read of /api/dashboard/overview
# per tenant re-computes against fresh source data and writes the new
# row via the cache-aside path in routes/dashboard-overview.ts.
#
# Why bother if Layer 2 (read-time MAX(updated_at) check) already
# catches drift?
#   • Layer 2 only catches updated_at-aware writes. An admin script
#     or a future code path that mutates a tracked table WITHOUT
#     bumping updated_at would slip past Layer 2 silently. The
#     nightly DELETE forces a re-compute regardless of updated_at
#     state.
#   • Cheap insurance — single DELETE statement, < 100ms total.
#
# Same CRON_SECRET pattern as refresh-mvs.yml. The Pages worker
# rejects with 503 if CRON_SECRET is missing on the server side, and
# 403 if the header doesn't match.
on:
  schedule:
    # 18:00 UTC = 02:00 SGT (UTC+8) — factory is closed, no operator
    # reads in flight to interrupt.
    - cron: '0 18 * * *'
  # Manual trigger for ops (e.g. after a hand-crafted backfill that
  # bypassed the standard updated_at bump).
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/rebuild-dashboard-snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is empty. See refresh-mvs.yml header for setup."
            exit 1
          fi

          # 30s timeout — the endpoint just runs DELETE FROM
          # dashboard_snapshot, so completes in < 1s typically.
          response=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
            --max-time 30 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            'https://hookka-erp-testing.pages.dev/api/internal/rebuild-dashboard-snapshot')

          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | sed '$d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "200" ]; then
            echo "::error::Rebuild failed with status $status"
            exit 1
          fi
