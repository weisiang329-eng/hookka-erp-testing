name: Verify bundle baseline

# The baseline is reviewed code, not bot-owned branch state. A previous
# workflow rewrote main after every push; its timestamp-only diffs produced
# hundreds of noisy commits and could race real deployments.
#
# To accept an intentional increase:
#   1. npm run build
#   2. node scripts/check-bundle-size.mjs --write-baseline
#   3. commit the reviewed baseline in the same PR as the source change

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: bundle-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce committed bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: Enforce page-aware loading budgets
        run: npm run perf:budgets:check
