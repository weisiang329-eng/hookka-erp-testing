<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hookka</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #1F1D1B; color: #F0ECE9;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
  }
  .wrap { max-width: 320px; }
  .mark {
    width: 56px; height: 56px; border-radius: 14px; background: #6B5C32;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 24px; font-weight: 600; color: #F0ECE9;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.6; color: #A8A29B; margin-bottom: 22px; }
  button {
    font: inherit; font-size: 15px; font-weight: 500;
    background: #6B5C32; color: #F0ECE9; border: 0; border-radius: 10px;
    padding: 12px 26px; cursor: pointer;
  }
  button:active { opacity: .8; }
  .hint { margin-top: 18px; font-size: 12px; color: #6B655E; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">H</div>
    <h1>No connection</h1>
    <p>Hookka needs the factory network or mobile data to load your live orders, job cards and punch clock.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">If this keeps happening on the shop floor, tell the office — the Wi-Fi may be weak in your area.</div>
  </div>
</body>
</html>
