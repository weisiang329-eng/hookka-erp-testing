# ---------------------------------------------------------------------------
# hookka-agent-heartbeat — standalone Cloudflare Cron Worker
# ---------------------------------------------------------------------------
# Reliable driver for the ERP agent heartbeat. Cloudflare Cron Triggers fire on
# time; GitHub Actions cron (the old sole driver) drifted 1–3.5h. See src/index.ts
# and README.md. Deploy is manual (`wrangler deploy`), same as hookka-mail-inbound.

name = "hookka-agent-heartbeat"
main = "src/index.ts"

# Reused verbatim from the root hookka-erp-testing/wrangler.toml so the runtime
# matches the ERP it drives.
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# account_id is deliberately NOT pinned here.
#
# It used to say 816e4573… with the comment "same one the Pages app deploys to".
# That was wrong, and it made the worker undeployable from CI: the repo's
# CLOUDFLARE_API_TOKEN reaches exactly ONE account — 27cd35c9…b059, the one
# .github/workflows/deploy.yml actually ships the Pages app to — so wrangler
# answered a bare "Authentication error [code: 10000]" (measured 2026-08-02).
#
# The copy that is live today at hookka-agent-heartbeat.houzs-erp.workers.dev
# sits on some third account nobody here can see, and it has never worked: it
# answers `beat failed: CRON_SECRET unset or too short` on every tick, so it has
# never sent the ERP a single request. It is inert, not a second driver.
#
# Leaving this unset means wrangler takes CLOUDFLARE_ACCOUNT_ID from the
# environment — the same value the Pages deploy uses — so the worker lands
# beside the app it drives instead of somewhere a laptop happened to be logged
# into.

# ---------------------------------------------------------------------------
# Cron Trigger — the whole point of this worker.
# ---------------------------------------------------------------------------
# Every 30 minutes. The endpoint self-throttles (min 1h gap between real agent
# runs, once-a-day digests), so a 30-min tick is deliberately TIGHTER than the
# hourly design cadence: it makes the fallback prompt (the 07:00 brief / 07:30
# delivery run go out within ~30 min even if GitHub drops their crons entirely)
# and drains the proposals backlog twice as often, at zero extra agent-run cost.
# CF free tier covers ~100k requests/day; 48 ticks/day is nothing.
#
# The */5 tick drives list warming (POST /api/internal/warm-lists). GitHub's
# warm-lists.yml asks for */5 too, but measured 2026-08-02 it delivered roughly
# ONE run an hour with 2h+ gaps — every production snapshot was 8h+ stale and
# the dept sheets were paying a cold recompute on every open (p50 ~8s, p95 30s
# = the client abort). Cloudflare fires on time; GitHub stays as a fallback.
# The heartbeat stays on */30 — scheduled() branches on controller.cron.
[triggers]
crons = ["*/30 * * * *", "*/5 * * * *"]

# ERP heartbeat endpoint. Plain [vars] (not a secret) so it travels with the
# deploy. The matching CRON_SECRET is a real secret — set it with
# `wrangler secret put CRON_SECRET` (same value as the ERP's CRON_SECRET),
# never here.
[vars]
HEARTBEAT_URL = "https://erp.hookka.com/api/internal/agents/heartbeat"
WARM_LISTS_URL = "https://erp.hookka.com/api/internal/warm-lists"
