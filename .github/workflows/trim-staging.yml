name: Trim staging (delete pre-cutoff data)

# Staging-ONLY data trim. Deletes business documents dated before a cutoff
# (default 2026-05-01) so the staging lists are shorter/lighter for testing.
#
# SAFETY:
#   * This workflow can ONLY see STAGING_DATABASE_URL — it has NO access to the
#     prod database secret, so it is physically incapable of touching prod.
#   * `mode: report` (default) is READ-ONLY — it introspects the FK graph, the
#     date columns, and row counts. It deletes NOTHING. Run this first.
#   * `mode: execute` runs the cascade delete inside a single transaction. It
#     requires confirm = TRIM.
#   * UNDO: re-run "Sync prod → staging" (sync-staging.yml) to restore the full
#     prod clone. Staging is disposable, so that is the recovery path.
#
# Lives on the `staging` branch; dispatch with:
#   gh workflow run trim-staging.yml --ref staging -f mode=report
#   gh workflow run trim-staging.yml --ref staging -f mode=execute -f confirm=TRIM

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report (read-only, default) | execute (deletes)'
        required: true
        type: choice
        default: report
        options:
          - report
          - execute
      cutoff:
        description: 'Delete documents dated BEFORE this date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-05-01'
      confirm:
        description: 'Type TRIM to confirm (only needed for execute)'
        required: false
        type: string

concurrency:
  group: trim-staging
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard — execute needs confirm=TRIM
        if: inputs.mode == 'execute'
        run: |
          if [[ "${{ inputs.confirm }}" != "TRIM" ]]; then
            echo "::error::execute mode requires confirm input to be exactly 'TRIM'. Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Execute confirmed for cutoff ${{ inputs.cutoff }}."

      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------------
      # REPORT (read-only) — map the live schema so the purge can be designed
      # against reality, not the migration files (the live staging schema is a
      # clone of prod and is the source of truth).
      # ---------------------------------------------------------------------
      - name: Report — FK graph (child → parent + delete rule)
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          echo '=== Foreign keys: child -> parent (delete rule: a=noaction r=restrict c=cascade n=setnull d=setdefault) ==='
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT conrelid::regclass::text AS child,
                   confrelid::regclass::text AS parent,
                   confdeltype AS del_rule,
                   conname
              FROM pg_constraint
             WHERE contype = 'f'
             ORDER BY parent, child;"

      - name: Report — candidate date columns on document tables
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          echo '=== date-ish columns (date/timestamp types OR name ILIKE %date%) ==='
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT table_name, column_name, data_type
              FROM information_schema.columns
             WHERE table_schema = 'public'
               AND ( data_type IN ('date','timestamp without time zone','timestamp with time zone')
                     OR column_name ILIKE '%date%' )
             ORDER BY table_name, column_name;"

      - name: Report — row counts for every base table
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          echo '=== live row counts per table (n_live_tup estimate, then exact for the big chains) ==='
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT relname AS table, n_live_tup AS est_rows
              FROM pg_stat_user_tables
             ORDER BY n_live_tup DESC
             LIMIT 60;"

      - name: Report — SO cut + chain column map + blast radius
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CUTOFF: ${{ inputs.cutoff }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          echo "=== SALES ORDER cut on company_so_date < ${CUTOFF} (undated = KEPT) ==="
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT
              count(*) FILTER (WHERE company_so_date >= '${CUTOFF}')                     AS keep_so,
              count(*) FILTER (WHERE company_so_date <  '${CUTOFF}')                     AS delete_so,
              count(*) FILTER (WHERE company_so_date IS NULL OR company_so_date = '')    AS undated_kept
            FROM sales_orders;"

          echo '=== chain tables — full column list (to confirm every link column) ==='
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT table_name,
                   string_agg(column_name, ', ' ORDER BY ordinal_position) AS columns
              FROM information_schema.columns
             WHERE table_schema = 'public'
               AND table_name IN (
                 'sales_orders','sales_order_items','so_status_changes',
                 'production_orders','job_cards','job_card_events','piece_pics',
                 'fg_units','fg_batches','fg_scan_history','wip_items','wip_cascade_log',
                 'cost_ledger','stock_movements','qc_inspections','qc_inspection_items',
                 'delivery_orders','delivery_order_items','invoices','invoice_items',
                 'folder_job_cards','dept_scan_events')
             GROUP BY table_name ORDER BY table_name;"

          echo '=== blast radius — rows the pre-cutoff SO chain would remove (certain links only) ==='
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            WITH del_so AS (SELECT id FROM sales_orders WHERE company_so_date < '${CUTOFF}'),
                 del_po AS (SELECT id FROM production_orders WHERE sales_order_id IN (SELECT id FROM del_so))
            SELECT
              (SELECT count(*) FROM del_so)                                                          AS sales_orders,
              (SELECT count(*) FROM sales_order_items WHERE sales_order_id IN (SELECT id FROM del_so)) AS sales_order_items,
              (SELECT count(*) FROM del_po)                                                          AS production_orders,
              (SELECT count(*) FROM job_cards WHERE production_order_id IN (SELECT id FROM del_po))   AS job_cards,
              (SELECT count(*) FROM job_card_events WHERE job_card_id IN
                 (SELECT id FROM job_cards WHERE production_order_id IN (SELECT id FROM del_po)))     AS job_card_events,
              (SELECT count(*) FROM piece_pics WHERE job_card_id IN
                 (SELECT id FROM job_cards WHERE production_order_id IN (SELECT id FROM del_po)))     AS piece_pics;"

      - name: Execute — delete the pre-cutoff SO chain (ONE transaction)
        if: inputs.mode == 'execute'
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CUTOFF: ${{ inputs.cutoff }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          # All-or-nothing: a single BEGIN/COMMIT with ON_ERROR_STOP. Any error
          # (e.g. an unexpected column / FK) aborts before COMMIT → nothing is
          # deleted. Roots on sales_orders.company_so_date < cutoff (undated SOs
          # are KEPT). Children deleted by confirmed link columns; job_card_events
          # / piece_pics / fg_scan_history / qc_inspection_items / invoice_items /
          # invoice_payments ride their FK ON DELETE CASCADE. DOs are removed only
          # when EVERY item belongs to a deleted PO (mixed DOs keep their header +
          # other items; their deleted-PO items are removed). Undo = re-run the
          # prod→staging sync. Polymorphic/ambiguous tables (cost_ledger,
          # so_status_changes, wip_items, dept_scan_events) are intentionally left
          # — they are logs/ledger, not rows the SO/PO/DO lists render.
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
          BEGIN;
          CREATE TEMP TABLE _del_so ON COMMIT DROP AS
            SELECT id FROM sales_orders
             WHERE company_so_date IS NOT NULL AND company_so_date <> '' AND company_so_date < '${CUTOFF}';
          CREATE TEMP TABLE _del_po ON COMMIT DROP AS
            SELECT id FROM production_orders WHERE sales_order_id IN (SELECT id FROM _del_so);
          CREATE TEMP TABLE _del_jc ON COMMIT DROP AS
            SELECT id FROM job_cards WHERE production_order_id IN (SELECT id FROM _del_po);
          CREATE TEMP TABLE _del_do ON COMMIT DROP AS
            SELECT d.id FROM delivery_orders d
             WHERE EXISTS (SELECT 1 FROM delivery_order_items i WHERE i.delivery_order_id = d.id AND i.production_order_id IN (SELECT id FROM _del_po))
               AND NOT EXISTS (SELECT 1 FROM delivery_order_items i WHERE i.delivery_order_id = d.id AND (i.production_order_id IS NULL OR i.production_order_id NOT IN (SELECT id FROM _del_po)));
          SELECT 'targets' AS label,
                 (SELECT count(*) FROM _del_so) AS sales_orders,
                 (SELECT count(*) FROM _del_po) AS production_orders,
                 (SELECT count(*) FROM _del_jc) AS job_cards,
                 (SELECT count(*) FROM _del_do) AS fully_ours_delivery_orders;
          SELECT 1 / (CASE
                   WHEN (SELECT count(*) FROM _del_so) BETWEEN 1
                        AND ((SELECT count(*) FROM sales_orders) - 1) THEN 1
                   ELSE 0
                 END) AS guard_must_be_partial_cut;
          DELETE FROM folder_job_cards     WHERE job_card_id        IN (SELECT id FROM _del_jc);
          DELETE FROM wip_cascade_log      WHERE job_card_id        IN (SELECT id FROM _del_jc);
          DELETE FROM qc_inspections       WHERE production_order_id IN (SELECT id FROM _del_po);
          DELETE FROM fg_units             WHERE po_id              IN (SELECT id FROM _del_po);
          DELETE FROM fg_batches           WHERE production_order_id IN (SELECT id FROM _del_po);
          DELETE FROM stock_movements      WHERE production_order_id IN (SELECT id FROM _del_po);
          DELETE FROM delivery_order_items WHERE production_order_id IN (SELECT id FROM _del_po);
          DELETE FROM delivery_orders      WHERE id                 IN (SELECT id FROM _del_do);
          DELETE FROM invoices             WHERE sales_order_id     IN (SELECT id FROM _del_so);
          DELETE FROM sales_order_items    WHERE sales_order_id     IN (SELECT id FROM _del_so);
          DELETE FROM job_cards            WHERE id                 IN (SELECT id FROM _del_jc);
          DELETE FROM production_orders    WHERE id                 IN (SELECT id FROM _del_po);
          DELETE FROM sales_orders         WHERE id                 IN (SELECT id FROM _del_so);
          COMMIT;"
          echo "=== remaining counts after delete ==="
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT (SELECT count(*) FROM sales_orders) AS sales_orders,
                   (SELECT count(*) FROM production_orders) AS production_orders,
                   (SELECT count(*) FROM job_cards) AS job_cards,
                   (SELECT count(*) FROM delivery_orders) AS delivery_orders,
                   (SELECT count(*) FROM invoices) AS invoices;"
          echo "=== orphan check (must be 0) ==="
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM production_orders p
                 WHERE p.sales_order_id IS NOT NULL
                   AND p.sales_order_id NOT IN (SELECT id FROM sales_orders)) AS orphan_production_orders,
              (SELECT count(*) FROM job_cards j
                 WHERE j.production_order_id IS NOT NULL
                   AND j.production_order_id NOT IN (SELECT id FROM production_orders)) AS orphan_job_cards;"
          echo "=== ANALYZE (refresh planner stats) ==="
          psql "$STAGING_URL" -P pager=off -v ON_ERROR_STOP=1 -c "ANALYZE;"
