name: Deploy cron worker

# ---------------------------------------------------------------------------
# Deploys agent-heartbeat-worker — the Cloudflare Cron Worker that drives BOTH
# the agent heartbeat (*/30) and list warming (*/5).
#
# WHY A WORKFLOW AND NOT `wrangler deploy` ON A LAPTOP
#   The worker previously only ever shipped by hand, which is why its */5 warm
#   tick could not go live the day it was written. This repo already holds
#   CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as secrets (deploy.yml uses
#   them for Pages), so the same credentials can ship the Worker — no local
#   `wrangler login`, and no one has to be at a keyboard.
#
# WHY MANUAL-ONLY (workflow_dispatch)
#   A cron worker is infrastructure, not application code. Deploying it on
#   every push to main would mean an unrelated commit could change how often
#   production warms itself. Run it when the worker changes.
#
# SECRETS ARE NOT TOUCHED
#   `wrangler deploy` replaces the script and its [vars]/[triggers]; secrets
#   set with `wrangler secret put` (CRON_SECRET) persist across deploys. This
#   workflow never reads or writes CRON_SECRET.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:

concurrency:
  group: deploy-cron-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard — required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      # A bare "Authentication error [code: 10000]" from wrangler has two very
      # different causes — a token without Workers scope, or a token belonging
      # to another account than the one wrangler.toml names. This says which,
      # so the fix is one specific click instead of a guess. Prints only
      # pass/fail and counts; never the token.
      - name: Diagnose the token before deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl --silent -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1"; }
          ok() { echo "$1" | grep -q '"success":true' && echo YES || echo NO; }

          echo "token itself valid ............ $(ok "$(api https://api.cloudflare.com/client/v4/user/tokens/verify)")"

          # The toml must NOT pin an account — it did, to an account this token
          # cannot reach, and that produced a bare "Authentication error
          # [code: 10000]" with no hint which of the two was wrong.
          if grep -qE '^account_id' agent-heartbeat-worker/wrangler.toml; then
            echo "::error::wrangler.toml pins an account_id again. Remove it — the"
            echo "::error::deploy must use CLOUDFLARE_ACCOUNT_ID, the account the Pages app ships to."
            exit 1
          fi
          echo "wrangler.toml pins no account .. YES (correct)"

          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          echo "can read Pages projects ....... $(ok "$(api "$base/pages/projects")")"
          echo "can read Workers scripts ...... $(ok "$(api "$base/workers/scripts")")"
          echo
          echo "accounts this token can reach (ids truncated):"
          api https://api.cloudflare.com/client/v4/accounts \
            | grep -oE '"id":"[a-f0-9]{32}"' | grep -oE '[a-f0-9]{32}' \
            | while read -r id; do
                mark=""
                [ "$id" = "$CLOUDFLARE_ACCOUNT_ID" ] && mark="  <-- the one we deploy to"
                echo "  ${id:0:8}…${id: -4}$mark"
              done
          echo
          echo "If 'can read Workers scripts' is NO, the token is Pages-scoped:"
          echo "add Account -> Workers Scripts -> Edit at"
          echo "https://dash.cloudflare.com/profile/api-tokens"

      - name: wrangler deploy
        working-directory: agent-heartbeat-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.84.1 deploy

      # ---------------------------------------------------------------------
      # The worker's CRON_SECRET, taken straight from the repo secret.
      #
      # A freshly-deployed Worker has no secrets — they do not travel with the
      # code — so the previous copy sat there answering
      #   beat failed: CRON_SECRET unset or too short
      # on every tick for two days, having never called the ERP once.
      #
      # Piping the repo secret in is not just convenience, it is the only way to
      # be SURE the value matches: this is the very same secret warm-lists.yml
      # already POSTs with successfully, so if the ERP accepts that, it accepts
      # this. Setting it by hand means reading a write-only value out of two
      # dashboards, or rotating all three places and hoping nothing was missed.
      #
      # Nobody reads the value; GitHub masks it in logs and wrangler does not
      # echo it. Idempotent — re-running just overwrites with the same value.
      # ---------------------------------------------------------------------
      - name: Set CRON_SECRET on the worker
        working-directory: agent-heartbeat-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ ${#CRON_SECRET} -lt 16 ]; then
            echo "::error::CRON_SECRET repo secret is unset or under 16 chars."
            echo "::error::The ERP rejects short secrets, so the worker would 403 on every tick."
            exit 1
          fi
          printf '%s' "$CRON_SECRET" | npx --yes wrangler@4.84.1 secret put CRON_SECRET

      - name: Prove the worker can now reach the ERP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The worker's own fetch handler runs one beat and reports the result,
          # which is a real end-to-end check: wrong secret -> 401 from the ERP,
          # unset -> "CRON_SECRET unset". Needs the workers.dev route, which is
          # not guaranteed to be enabled, so a failure here is a warning, not a
          # build break — the schedules are already live either way.
          sub=$(curl --silent -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | grep -oE '"subdomain":"[^"]+"' | cut -d'"' -f4)
          if [ -z "$sub" ]; then
            echo "::warning::no workers.dev subdomain on this account — skipping the live beat check"
            exit 0
          fi
          url="https://hookka-agent-heartbeat.$sub.workers.dev"
          echo "beat check: $url"
          code=$(curl --silent --max-time 30 -o /tmp/beat.txt -w '%{http_code}' "$url" || echo 000)
          echo "HTTP $code"
          head -c 300 /tmp/beat.txt; echo
          [ "$code" = "200" ] || echo "::warning::beat did not return 200 — see the body above"

      - name: Show the schedules that are now live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Reads back what Cloudflare actually stored, rather than trusting
          # that the toml said what we meant.
          curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/hookka-agent-heartbeat/schedules" \
            | head -c 2000
          echo
