name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
      # `staging` is the long-lived staging branch. Pushes to this branch
      # deploy to https://staging.hookka-erp-testing.pages.dev (Cloudflare
      # Pages preview slug). worker.ts routes the subdomain to
      # HYPERDRIVE_STAGING (= hookka-erp-staging Supabase in Tokyo).
      # Trigger lives only on the staging branch for now to avoid
      # touching main's deploy.yml until ready to merge.
      - staging
  # Also run on every PR targeting main so the required `deploy` status
  # check is produced regardless of the PR's source branch. Without this,
  # PRs from teammate / feature branches can never satisfy the branch
  # protection rule because no push event ever runs for them.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      # canary deploy posts a comment on the PR with the preview URL
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint — non-blocking (P2). ~92 known errors documented in
      # docs/KNOWN-ISSUES.md (most: react-hooks/set-state-in-effect on the
      # idiomatic fetch->setState pattern, pre-React-Query migration). Until
      # those are triaged, lint as a deploy gate would fail every PR. Sprint
      # 6 flipped bundle-size to blocking (above) but kept lint non-blocking
      # — to be promoted once the known errors are cleared.
      - name: Lint (app)
        run: npm run lint:app
        continue-on-error: true

      - run: npm test

      # Strict build: runs `typecheck:app && vite build`. The typecheck gate
      # is BLOCKING — any TS error fails the deploy. Paired with `strict: true`
      # in tsconfig.app.json (TS.E), this is the graduated form of P1.6 in
      # docs/UPGRADE-CONTROL-BOARD.md: no `continue-on-error`, no opt-out.
      #
      # VITE_SENTRY_DSN is injected at build time so the bundled JS knows
      # where to report client-side errors. The DSN is public-safe per
      # Sentry docs (event-submission only, no data read), so we keep it
      # in the workflow file rather than as a GH secret — keeps the
      # Sentry pipeline self-healing across forks / new clones / new CI
      # runners. Mirrors the wrangler.toml `[vars] SENTRY_DSN` for the
      # worker side.
      # ---------------------------------------------------------------------
      # Stale-chunk root cause: a Pages deployment serves ONLY its own files.
      # Vite fingerprints every chunk, so the moment a deploy lands, the chunk
      # names every currently-open browser is still holding stop existing. Pages
      # answers with the SPA fallback (index.html, text/html), the browser
      # refuses it as a module, and the tab breaks — including a lazy route the
      # user opens minutes later. Client-side recovery exists, but it is a net,
      # not a fix: 2026-08-02 the owner hit a full error page on /employees with
      # both recovery attempts spent (the second reload landed on a 504 mid-
      # deploy). The fix is to stop deleting the old files.
      #
      # THIS WAS TRIED ON 2026-08-01 AND REVERTED — production stopped booting,
      # splash rendered, React never attached, every route, clean profile too.
      # I blamed this step because it was the only deploy-mechanism change that
      # day. Re-examined 2026-08-02, that was very likely the wrong culprit:
      #
      #  * public/sw.js's background precache fired all 60 assets at once, so a
      #    fresh SW claimed the booting page and its entry chunks queued behind
      #    60 parallel downloads. The comment now in sw.js describes the result
      #    as "no error, no failed request, just a splash that hangs" — the
      #    exact symptom. That bug shipped 06-29, was live during the outage,
      #    and was only found and fixed at 01:33 on 08-02 (1babbe69).
      #  * Both assumptions this step rests on were measured on 08-02 and hold:
      #    a real build emits 249 files into dist/assets and ZERO of them are
      #    unhashed, so `cp -n` cannot serve a stale version of anything the new
      #    build emits, and a hash collision would mean identical content.
      #  * index.html, sw.js and _headers live in dist ROOT, not dist/assets.
      #    This step cannot change what index.html references or how the SW
      #    behaves.
      #
      # Staging first, deliberately. Merge to main only after several
      # consecutive staging deploys with tabs held open.
      - name: Restore previous builds' assets
        uses: actions/cache/restore@v4
        with:
          path: .asset-history
          key: asset-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            asset-history-${{ github.ref_name }}-

      - run: npm run build:strict
        env:
          VITE_SENTRY_DSN: https://0b81e5f99dab7b31f74514a5bb9f6f62@o4511302465814528.ingest.us.sentry.io/4511302481346560

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs
        continue-on-error: true

      # Fill in every asset a previous deploy served that this build no longer
      # emits. `cp -n` never overwrites, so the new build always wins for names
      # it does emit; only genuinely-retired files are carried.
      - name: Carry previous assets into this deployment
        run: |
          set -u
          # A Pages deployment is capped at 20,000 files. One build is ~250, and
          # a busy day here is 100+ deploys — the ORIGINAL version of this step
          # had only a 14-day prune and no count cap, which on this repo's real
          # cadence would have walked into that ceiling and started failing
          # deploys outright. Age prune AND a hard count cap, and the cap is set
          # so the served total stays an order of magnitude below the limit.
          RETAIN_DAYS=7
          MAX_CARRIED=4000
          mkdir -p .asset-history dist/assets

          # ORDER MATTERS. Record this build FIRST, prune, and only then carry
          # survivors into the deployment. The other way round silently disables
          # the prune: `cp` does not preserve mtime, so every carried file is
          # re-stamped today on every deploy and nothing is ever old enough to
          # drop. The history would grow without bound.
          cp -R dist/assets/. .asset-history/ 2>/dev/null || true

          aged=$(find .asset-history -type f -mtime +$RETAIN_DAYS | wc -l)
          find .asset-history -type f -mtime +$RETAIN_DAYS -delete 2>/dev/null || true

          # Count cap — drop the OLDEST beyond MAX_CARRIED. Newest survive,
          # which is what an open tab is most likely to still be asking for.
          total=$(find .asset-history -type f | wc -l)
          capped=0
          if [ "$total" -gt "$MAX_CARRIED" ]; then
            capped=$((total - MAX_CARRIED))
            find .asset-history -type f -printf '%T@ %p\n' \
              | sort -n | head -n "$capped" | cut -d' ' -f2- \
              | tr '\n' '\0' | xargs -0 -r rm -f
          fi

          # Hand the PREVIOUS deploy's entry chunk to the verify step below,
          # then record this build's for the next run. Read before write — the
          # cache save happens after this step, so the marker has to be updated
          # here or it would never persist.
          echo "PREV_ENTRY=$(cat .asset-history/.previous-entry 2>/dev/null || true)" >> "$GITHUB_ENV"
          grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1 \
            > .asset-history/.previous-entry || true

          before=$(find dist/assets -type f | wc -l)
          cp -Rn .asset-history/. dist/assets/ 2>/dev/null || true
          # The marker is bookkeeping, not an asset — don't ship it.
          rm -f dist/assets/.previous-entry
          after=$(find dist/assets -type f | wc -l)

          # No silent caps: say exactly what was dropped and why, so a deploy
          # that quietly stopped carrying anything is visible in the log.
          echo "this build:      $before file(s)"
          echo "carried forward: $((after - before)) retired file(s)"
          echo "serving:         $after file(s)  (Pages limit 20000)"
          echo "history:         $(find .asset-history -type f | wc -l) file(s), $(du -sh .asset-history | cut -f1)"
          echo "pruned:          $aged older than ${RETAIN_DAYS}d, $capped over the ${MAX_CARRIED}-file cap"
          if [ "$after" -gt 15000 ]; then
            echo "::warning::serving $after files — approaching the 20000 Pages limit; lower MAX_CARRIED"
          fi

      # Deploy to Cloudflare Pages — main branch path. Preserves the
      # original behavior: pushes to `main` and `claude/**` deploy to
      # the matching branch slug on Pages.

      # Fill in every asset a previous deploy served that this build no longer
      # emits. `cp -n` never overwrites, so the new build always wins for names
      # it does emit; only genuinely-retired files are carried.
      # workflow_dispatch included 2026-08-02. It was 'push' only, so a manual
      # re-run built, tested and then SKIPPED the deploy — which is how a merge
      # into `staging` that produced no push run at all left staging sitting
      # undeployed with no way to kick it except an empty commit.
      - name: Deploy to Cloudflare Pages (main / branch push)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hookka-erp-testing --branch=${{ github.ref_name }}

      - name: Save assets for the next deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .asset-history
          key: asset-history-${{ github.ref_name }}-${{ github.run_id }}

      # The proof, not the intention. Take the entry chunk the PREVIOUS
      # deployment served and ask the live site for it: 200 with a JS
      # content-type means an already-open tab survives this deploy; the SPA
      # fallback (text/html) or a 404 means it does not, and carrying is not
      # actually working however clean the log above looks.
      #
      # Non-blocking — this reports, it does not gate. A false alarm here must
      # never be able to hold up a deploy.
      - name: Verify the previous build's entry chunk still resolves
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -u
          case "${{ github.ref_name }}" in
            main) BASE="https://erp.hookka.com" ;;
            *)    BASE="https://${{ github.ref_name }}.hookka-erp-testing.pages.dev" ;;
          esac
          prev="${PREV_ENTRY:-}"
          if [ -z "$prev" ]; then
            echo "no previous entry recorded yet — first run after this change. Nothing to verify."
            exit 0
          fi
          echo "previous entry chunk: $prev"
          sleep 20
          code=$(curl -s -o /tmp/prev.js -w '%{http_code}' "$BASE$prev" || echo 000)
          ctype=$(curl -s -o /dev/null -w '%{content_type}' "$BASE$prev" || echo unknown)
          echo "HTTP $code  content-type: $ctype"
          case "$ctype" in
            *javascript*) echo "OK — an open tab from the previous deploy still resolves its chunks." ;;
            *) echo "::warning::$prev came back '$ctype' (HTTP $code) — carry-forward is NOT protecting open tabs." ;;
          esac

      # ---------------------------------------------------------------------
      # Phase B.5 — Canary deploy on PR.
      # ---------------------------------------------------------------------
      # Every PR targeting main also deploys to a unique Pages preview
      # branch (`canary-<PR_NUMBER>`). Cloudflare Pages auto-creates a
      # preview URL for each branch slug. Reviewers can click the URL in
      # the PR comment to test the change against real Pages
      # infrastructure (Hyperdrive, KV, R2 bindings — all live in
      # preview env).
      #
      # Promote-to-main = merge the PR. The push event on main re-runs
      # the workflow and deploys to the production branch.
      # ---------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages (canary)
        if: github.event_name == 'pull_request'
        id: canary
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hookka-erp-testing --branch=canary-${{ github.event.pull_request.number }}

      - name: Comment canary URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Cloudflare Pages preview URLs follow the pattern
            //   https://<branch-slug>.<project-name>.pages.dev
            // The branch slug is normalized: lowercase, dashes, no `/`.
            const prNumber = context.payload.pull_request.number;
            const branchSlug = `canary-${prNumber}`;
            const url = `https://${branchSlug}.hookka-erp-testing.pages.dev`;
            const marker = '<!-- canary-deploy-comment -->';
            const body = [
              marker,
              `### Canary deploy ready`,
              ``,
              `Preview URL: ${url}`,
              ``,
              `This branch is wired to the same Hyperdrive (→ Supabase Postgres) and KV bindings as production. (D1 binding was retired 2026-04-27; runtime data path is Postgres.) Test changes here before merging — see [docs/CANARY-DEPLOY.md](../blob/main/docs/CANARY-DEPLOY.md) for the review checklist.`,
              ``,
              `Promote to main = merge this PR.`,
            ].join("\n");

            // Update existing comment if present (avoid spam on every push)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      # ---------------------------------------------------------------------
      # [LEGACY-RETIRED 2026-04-27] D1 migrations step removed.
      # ---------------------------------------------------------------------
      # The runtime data layer is Supabase Postgres (via Hyperdrive); the D1
      # binding was removed in commit 7059259. The previous step here ran
      # `wrangler d1 migrations apply hookka-erp-db --remote` against an
      # instance with zero live traffic, which silently masked the fact
      # that migrations 0061-0063 never reached prod Supabase.
      #
      # Postgres migrations are applied manually for now — the operator
      # runs locally:
      #   npm run db:migrate:supabase:dry   # preview pending files
      #   npm run db:migrate:supabase       # apply to prod (uses _migrations
      #                                     # tracker table, idempotent)
      # against the prod DATABASE_URL in .dev.vars. See
      # migrations-postgres/README.md for the full flow.
      #
      # Why not re-add an automated CI step against Supabase?
      # 1. The Supabase prod DATABASE_URL would need to live as a CI secret.
      # 2. A failed migration mid-deploy is harder to recover than a
      #     deliberate operator-run apply.
      # 3. The new incremental tool is safe to re-run, so the operator can
      #     simply re-run after fixing a bad SQL file.
      # If/when this gets automated, wire `npm run db:migrate:supabase`
      # into a step gated on `github.ref == 'refs/heads/main'` with the
      # Supabase pooler URL exposed via `secrets.SUPABASE_DATABASE_URL`.
      - name: Schema migrations (manual reminder)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::notice::Postgres migrations are applied manually. Run 'npm run db:migrate:supabase:dry' locally to preview, then 'npm run db:migrate:supabase' against prod DATABASE_URL. See migrations-postgres/README.md."

      # Guard against the "migration file landed but Supabase never got it"
      # bug we hit with three_pl_vehicles / three_pl_drivers (0063 sat in
      # migrations-postgres/ for days while the live DB was missing the
      # tables, so 3PL Save Vehicle silently failed with "relation does
      # not exist"). Parses every CREATE TABLE in migrations-postgres/*.sql,
      # diffs against information_schema.tables on Supabase, fails if any
      # migration-declared table is missing. Runs AFTER deploy so a deploy
      # is never gated on a schema diff that itself requires the deploy.
      # Push-to-main only - preview / PR builds skip this step.
      #
      # Set DATABASE_URL in repo secrets to the Supabase pooler URL
      # (port 6543) for this check to run.
      - name: Verify Postgres schema is in sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-schema-applied.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
