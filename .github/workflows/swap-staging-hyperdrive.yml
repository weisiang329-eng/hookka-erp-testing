name: One-shot — swap HYPERDRIVE_STAGING to new SG project

# Updates the existing HYPERDRIVE_STAGING binding's origin connection to
# point at the new Singapore Supabase project (hookka-erp-staging-sg,
# kahxgvbfanbraazetefr). Keeping the SAME Hyperdrive config id means
# wrangler.toml + worker.ts route logic don't need any change.
#
# Disposable: this workflow is committed for one-time use and deleted in
# the follow-up cleanup commit.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SWAP to confirm'
        required: true
        type: string

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "SWAP" ]]; then
            echo "::error::Must type SWAP in the confirm input"
            exit 1
          fi
          echo "Confirmed swap"

      - name: PATCH Cloudflare Hyperdrive config 759227c0 → SG project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DB_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          # Extract password from session-pooler STAGING_DATABASE_URL
          # (format: postgresql://postgres.<ref>:<password>@aws-...). The
          # session pooler URL has username `postgres.<ref>` — we just need
          # the password component for the Hyperdrive origin block.
          PASSWORD=$(printf '%s' "$STAGING_DB_URL" | sed -nE 's#^postgresql://[^:]+:([^@]+)@.*#\1#p')
          if [[ -z "$PASSWORD" ]]; then
            echo "::error::Failed to parse password from STAGING_DATABASE_URL"
            exit 1
          fi

          # New SG project ref baked in — this workflow is single-use.
          NEW_REF="kahxgvbfanbraazetefr"
          NEW_HOST="db.${NEW_REF}.supabase.co"
          HYPERDRIVE_ID="759227c0381a4a19ab7537ea48a1560f"

          echo "PATCH https://api.cloudflare.com/.../hyperdrive/configs/$HYPERDRIVE_ID"
          echo "  new host: $NEW_HOST"
          echo "  user: postgres"
          echo "  password length: ${#PASSWORD}"

          RESPONSE=$(curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/hyperdrive/configs/$HYPERDRIVE_ID" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg host "$NEW_HOST" \
              --arg password "$PASSWORD" \
              '{
                name: "hookka-erp-staging-sg",
                origin: {
                  scheme: "postgres",
                  host: $host,
                  port: 5432,
                  database: "postgres",
                  user: "postgres",
                  password: $password
                }
              }')")
          echo "Response: $RESPONSE"

          # Verify Cloudflare API success
          SUCCESS=$(printf '%s' "$RESPONSE" | jq -r '.success // false')
          if [[ "$SUCCESS" != "true" ]]; then
            echo "::error::Cloudflare API returned failure"
            printf '%s' "$RESPONSE" | jq '.'
            exit 1
          fi
          echo "✓ Hyperdrive swap complete"
