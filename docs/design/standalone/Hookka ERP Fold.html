      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');

    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();

            writer.close();

              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

den; text-overflow:ellipsis;\">{{ c.sub }}<\u002Fdiv><\u002Fsc-if>\n                  <div style=\"display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid #F2EEE6;\">\n                    <div style=\"flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:9px 16px;\">\n                      <sc-for list=\"{{ c.metas }}\" as=\"m\" hint-placeholder-count=\"2\">\n                        <div style=\"min-width:0;\">\n                          <div style=\"font-size:10px; color:#A89F8D; font-weight:600; letter-spacing:.3px; text-transform:uppercase;\">{{ m.label }}<\u002Fdiv>\n                          <div style=\"font-size:13px; font-weight:600; color:#1F1D1B; margin-top:2px; white-space:nowrap;\">{{ m.value }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <lucide-icon name=\"chevron-right\" size=\"19\" color=\"#C4BDB2\" style=\"flex:none;\"><\u002Flucide-icon>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ---- WAREHOUSE (custom) ---- -->\n          <sc-if value=\"{{ isWhList }}\" hint-placeholder-val=\"\">\n          <div style=\"padding:2px 18px 120px; animation:hkPush .3s ease both; max-width:780px; margin:0 auto;\">\n\n            <!-- toast -->\n            <sc-if value=\"{{ wh.hasToast }}\" hint-placeholder-val=\"\">\n              <div style=\"background:#1F1D1B; color:#fff; border-radius:13px; padding:11px 15px; margin-bottom:12px; display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;\">\n                <lucide-icon name=\"check-circle\" size=\"17\" color=\"#C6DBA8\"><\u002Flucide-icon>{{ wh.toast }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ===== RACK OVERVIEW ===== -->\n            <sc-if value=\"{{ wh.isRack }}\" hint-placeholder-val=\" er-count=\"4\"><span onclick=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:700; color:#4D4630; margin-bottom:8px;\">Notes <span style=\"color:#9A9082; font-weight:500;\">(optional)<\u002Fspan><\u002Fdiv>\n                <input value=\"{{ wh.notes }}\" oninput=\"{{ wh.onNotes }}\" placeholder=\"Additional notes…\" style=\"width:100%; height:42px; border:1px solid #E2DDD8; border-radius:11px; padding:0 13px; font-family:inherit; font-size:13.5px; color:#1F1D1B; background:#FAF8F4; margin-bottom:15px;\">\n                <button onclick=\"{{ wh.confirmIn }}\" style=\"{{ wh.inBtnStyle }}\"><lucide-icon name=\"arrow-down-to-line\" size=\"17\" color=\"#fff\"><\u002Flucide-icon>Confirm Stock In<\u002Fbutton>\n              <\u002Fdiv>\n              <!-- Stock Out -->\n              <div style=\"background:#fff; border:1px solid #E7E0D4; border-radius:18px; padding:17px; margin-bottom:13px;\">\n                <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:14px;\"><lucide-icon name=\"arrow-up-from-line\" size=\"19\" color=\"#9A3A2D\"><\u002Flucide-icon><span style=\"font-size:16px; font-weight:800; color:#1F1D1B;\">Stock Out<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:700; color:#4D4630; margin-bottom:8px;\">Select Occupied Rack<\u002Fdiv>\n                <div class=\"scrollarea\" style=\"display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;\"><sc-for list=\"{{ wh.orackChips }}\" as=\"o\" hint-placeholder-count=\"3\"><span onclick=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:700; color:#4D4630; margin-bottom:8px;\">Reason<\u002Fdiv>\n                <input value=\"{{ wh.reason }}\" oninput=\"{{ wh.onReason }}\" placeholder=\"Delivered, transferred, damaged…\" style=\"width:100%; height:42px; border:1px solid #E2DDD8; border-radius:11px; padding:0 13px; font-family:inherit; font-size:13.5px; color:#1F1D1B; background:#FAF8F4; margin-bottom:15px;\">\n                <button onclick=\"{{ wh.confirmOut }}\" style=\"{{ wh.outBtnStyle }}\"><lucide-icon name=\"arrow-up-from-line\" size=\"17\" color=\"#fff\"><\u002Flucide-icon>Confirm Stock Out<\u002Fbutton>\n              <\u002Fdiv>\n              <!-- Recent movements -->\n              <div style=\"display:flex; align-items:center; gap:8px; margin:18px 2px 11px;\"><lucide-icon name=\"history\" size=\"17\" color=\"#6B5C32\"><\u002Flucide-icon><span style=\"font-size:15px; font-weight:800; color:#1F1D1B;\">Recent Movements<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#fff; border:1px solid #E7E0D4; border-radius:16px; overflow:hidden;\">\n                <sc-for list=\"{{ wh.recent }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid #F2EEE6;\">\n                    <span style=\"{{ m.iconWrap }}\"><lucide-icon name=\"{{ m.icon }}\" size=\"16\" color=\"{{ m.iconColor }}\"><\u002Flucide-icon><\u002Fspan>\n                    <div style=\"flex:1; min-width:0;\">\n                      <div style=\"font-size:13px; font-weight:600; color:#1F1D1B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ m.product }}<\u002Fdiv>\n                      <div style=\"font-size:11px; color:#9A9082; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ m.doc }} · {{ m.rack }} · {{ m.date }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right; flex:none;\"><span style=\"{{ m.pillStyle }}\">{{ m.type }}<\u002Fspan><div style=\"font-size:12px; font-weight:700; color:#1F1D1B; margin-top:4px;\">×{{ m.qty }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ===== MOVEMENT HISTORY ===== -->\n            <sc-if value=\"{{ wh.isMove }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex; gap:7px; margin-bottom:13px;\"><sc-for list=\"{{ wh.histChips }}\" as=\"o\" hint-placeholder-count=\"3\"><span onclick=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n              <div style=\"font-size:11.5px; color:#9A9082; font-weight:600; margin:0 2px 10px;\">{{ wh.histCount }} movements<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:10px;\">\n                <sc-for list=\"{{ wh.history }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <div style=\"background:#fff; border:1px solid #E7E0D4; border-radius:14px; padding:13px 14px;\">\n                    <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px;\">\n                      <span style=\"{{ m.pillStyle }}\">{{ m.type }}<\u002Fspan>\n                      <span style=\"font-size:11px; color:#9A9082; font-weight:600;\">{{ m.date }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:13.5px; font-weight:600; color:#1F1D1B; margin-top:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ m.product }}<\u002Fdiv>\n                    <div style=\"display:flex; align-items:center; gap:14px; margin-top:11px; padding-top:11px; border-top:1px solid #F2EEE6;\">\n                      <div><div style=\"font-size:9.5px; color:#A89F8D; font-weight:700; text-transform:uppercase; letter-spacing:.3px;\">Rack<\u002Fdiv><div style=\"font-size:12.5px; font-weight:600; color:#1F1D1B;\">{{ m.rack }}<\u002Fdiv><\u002Fdiv>\n                      <div style=\"min-width:0; flex:1;\"><div style=\"font-size:9.5px; color:#A89F8D; font-weight:700; text-transform:uppercase; letter-spacing:.3px;\">Document<\u002Fdiv><div style=\"font-size:12.5px; font-weight:600; color:#6B5C32; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ m.doc }}<\u002Fdiv><\u002Fdiv>\n                      <div style=\"text-align:right;\"><div style=\"font-size:9.5px; color:#A89F8D; font-weight:700; text-transform:uppercase; letter-spacing:.3px;\">Qty<\u002Fdiv><div style=\"font-size:12.5px; font-weight:700; color:#1F1D1B;\">×{{ m.qty }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px; color:#9A9082; margin-top:9px;\">{{ m.reason }} · by {{ m.by }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ---- PRODUCTION (mobile board) ---- -->\n          <sc-if value=\"{{ isProd }}\" hint-placeholder-val=\"\">\n          <div style=\"padding:2px 0 120px; animation:hkPush .3s ease both;\">\n            <sc-for list=\"{{ prodDepts }}\" as=\"d\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:6px;\">\n                <div style=\"display:flex; align-items:center; gap:9px; padding:10px 20px 8px;\">\n                  <span style=\"{{ d.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-size:14px; font-weight:700; color:#1F1D1B;\">{{ d.dept }}<\u002Fspan>\n                  <span style=\"font-size:11px; font-weight:700; color:#9A9082; background:#fff; border:1px solid #E7E0D4; padding:1px 8px; border-radius:20px;\">{{ d.count }}<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"scrollarea\" style=\"display:flex; gap:11px; overflow-x:auto; padding:4px 18px 8px;\">\n                  <sc-for list=\"{{ d.jobs }}\" as=\"j\" hint-placeholder-count=\"2\">\n                    <div style=\"width:210px; flex:none; background:#fff; border:1px solid #E7E0D4; border-radius:15px; padding:13px 14px;\">\n                      <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n                        <span style=\"font-size:11px; font-weight:700; color:#6B5C32;\">{{ j.so }}<\u002Fspan>\n                        <span style=\"{{ j.badgeStyle }}\">{{ j.status }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:13.5px; font-weight:600; color:#1F1D1B; margin-top:8px; line-height:1.3;\">{{ j.product }}<\u002Fdiv>\n                      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:10px;\">\n                        <span style=\"font-size:11.5px; color:#9A9082;\">Qty <b style=\"color:#4D4630;\">{{ j.qty }}<\u002Fb><\u002Fspan>\n                        <span style=\"font-size:11px; color:#9A9082;\">{{ j.due }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"margin-top:9px; height:5px; background:#F0EBE0; border-radius:4px; overflow:hidden;\"><div style=\"{{ j.progStyle }}\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ---- DETAIL ---- -->\n          <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"\">\n          <div style=\"padding:2px 18px 130px; animation:hkPush .3s ease both;\">\n            <div style=\"background:#fff; border:1px solid #E7E0D4; border-radius:18px; padding:18px; margin-bottom:13px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n                <span style=\"font-size:13px; font-weight:700; color:#6B5C32;\">{{ detail.code }}<\u002Fspan>\n                <sc-if value=\"{{ detail.status }}\" hint-placeholder-val=\"\"><span style=\"{{ detail.badgeStyle }}\">{{ detail.status }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:21px; font-weight:800; color:#1F1D1B; margin-top:9px; letter-spacing:-.4px;\">{{ detail.title }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:#9A9082; margin-top:3px;\">{{ detail.sub }}<\u002Fdiv>\n              <sc-if value=\"{{ detailAckable }}\" hint-placeholder-val=\"\">\n                <div onclick=\"{{ detailAckClick }}\" style=\"display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:7px 13px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; border:1px solid #C6DBA8; background:#EEF3E4; color:#4F7C3A;\"><lucide-icon name=\"check-check\" size=\"15\" color=\"#4F7C3A\"><\u002Flucide-icon>{{ detailAckLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <!-- progress steps (orders only) -->\n              <sc-if value=\"{{ detail.isOrder }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex; align-items:center; margin-top:18px;\">\n                <sc-for list=\"{{ detail.steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n                  <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; position:relative;\">\n                    <div style=\"{{ st.barStyle }}\"><\u002Fdiv>\n                    <div style=\"{{ st.dotStyle }}\"><sc-if value=\"{{ st.done }}\" hint-placeholder-val=\"\"><lucide-icon name=\"check\" size=\"12\" color=\"#fff\"><\u002Flucide-icon><\u002Fsc-if><\u002Fdiv>\n                    <div style=\"font-size:9.5px; color:{{ st.labelColor }}; margin-top:6px; font-weight:600; text-align:center;\">{{ st.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <!-- field grid -->\n            <div style=\"background:#fff; border:1px solid #E7E0D4; border-radius:18px; padding:4px 18px; margin-bottom:13px;\">\n              <sc-for list=\"{{ detail.fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid #F2EEE6;\">\n                  <span style=\"font-size:13px; color:#9A9082;\">{{ f.label }}<\u002Fspan>\n                  <span style=\"font-size:13.5px; font-weight:600; color:#1F1D1B; text-align:right; max-width:60%;\">{{ f.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- ===== SERVICE CASE ===== -->\n            <sc-if value=\"{{ detail.isCase }}\" hint-placeholder-val=\"\">\n              <sc-if value=\"{{ detail.hasCaseToast }}\" hint-placeholder-val=\"\">\n                <div style=\"background:#1F1D1B; color:#fff; border-radius:13px; padding:11px 15px; margin-bottom:13px; display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;\"><lucide-icon name=\"check-circle\" size=\"17\" color=\"#C6DBA8\"><\u002Flucide-icon>{{ detail.caseToastMsg }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <!-- start / advance + edit -->\n              <div style=\"display:flex; gap:8px; margin-bottom:13px;\">\n                <button onclick=\"{{ detail.startWork }}\" style=\"flex:1; height:48px; border:none; border-radius:13px; background:#6B5C32; color:#fff; font-family:inherit; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;\"><lucide-icon name=\"play\" size=\"17\" color=\"#fff\"><\u002Flucide-icon>{{ detail.startLabel }}<\u002Fbutton>\n                <button onclick=\"{{ detail.editFields }}\" style=\"flex:none; width:48px; height:48px; border:1px solid #E2DDD8; background:#fff; border-radius:13px; display:flex; align-items:center; justify-content:center; cursor:pointer;\"><lucide-icon name=\"pencil\" size=\"18\" color=\"#6B5C32\"><\u002Flucide-icon><\u002Fbutton>\n              <\u002Fdiv>\n              <!-- 8-step vertical pipeline -->\n              <div style=\"background:#fff; border:1px solid #E7E0D4; border-radius:16px; padding:16px 17px; margin-bottom:13px;\">\n                <div st
