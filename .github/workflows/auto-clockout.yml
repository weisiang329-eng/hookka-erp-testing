name: Auto Clock-Out — Forgotten Punches (Daily)

# Hits POST /api/internal/auto-clockout after midnight Malaysia time so any
# worker who clocked IN but never OUT gets their prior day closed at shift end
# and counted as a NORMAL shift (standard hours, no OT, no dock), flagged in
# Attendance. This covers workers who DON'T return the next day — the per-clock-
# in self-heal in the worker portal only fires when they actually punch in again.
# The endpoint is idempotent (only touches rows still clockOut IS NULL), so a
# re-fire — or an overlap with a worker's own next-day clock-in — is harmless.
#
# MYT = UTC+8, so 00:30 MYT = 16:30 UTC. A second run at 02:00 MYT (18:00 UTC)
# is a safety net for GitHub's occasionally-skipped/delayed scheduled runs.
#
# NOTE: GitHub only runs `schedule:` on the DEFAULT branch (main → production).
# On the staging branch this file rides along but won't auto-fire; use the
# workflow_dispatch button (or curl the staging endpoint) to test there.
#
# Auth: the endpoint expects an x-cron-secret header matching the CRON_SECRET
# repo secret AND the CRON_SECRET env var on Cloudflare Pages (same value on
# both). Server returns 503 if its env var is missing, 403 if the header differs.
on:
  schedule:
    - cron: '30 16 * * *'   # 00:30 MYT
    - cron: '0 18 * * *'    # 02:00 MYT (safety net)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/auto-clockout
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is empty. See workflow header for setup."
            exit 1
          fi

          # 60s timeout: a warm Pages worker responds in ~2-3s, but a cold start
          # during Hyperdrive's first SQL round-trip can stretch to 30s+.
          response=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
            --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            'https://hookka-erp-testing.pages.dev/api/internal/auto-clockout')

          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | sed '$d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" -ne 200 ]; then
            echo "::error::auto-clockout failed with HTTP $status"
            exit 1
          fi
