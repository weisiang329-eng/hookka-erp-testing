<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hookka-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hookka Manufacturing ERP</title>
    <!-- PWA Phase 1 — installable shell. Manifest + Apple touch icon let the
         worker portal "Add to Home Screen" as a standalone app. theme-color
         tints the Android status bar to the brand olive. The service worker
         is registered from src/main.tsx (production builds only). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6B5C32" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hookka" />
    <!-- JetBrains Mono: the app's code/number font (see --font-mono in
         index.css). Without this it silently fell back to the OS default
         monospace, where "0" and "O" look almost identical on document
         numbers / SO IDs. JetBrains Mono draws an unmistakable zero. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
