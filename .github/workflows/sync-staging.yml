name: Sync prod → staging

# Refreshes the staging Supabase project from a pg_dump of prod. Dumps and
# restores the `public` schema only (Supabase-managed schemas like `auth`,
# `storage`, `extensions` are left untouched on both ends).
#
# Triggers:
#   * workflow_dispatch — manual one-shot. Requires typing `SYNC` in the
#     confirm input to fire (guard against accidental clicks).
#   * schedule — nightly at 02:00 SGT (18:00 UTC). GitHub Actions runs this
#     schedule from the default branch (main).
#
# Secrets required:
#   * PROD_DATABASE_URL    — session pooler URL for prod Supabase
#   * STAGING_DATABASE_URL — session pooler URL for staging Supabase
#   * STAGING_WORKER_PIN_HASH — SHA-256 hash of the private staging test PIN
#
# Repository variables required (public Supabase project identifiers):
#   * PROD_SUPABASE_PROJECT_REF
#   * STAGING_SUPABASE_PROJECT_REF
#
# Both URLs MUST use the session pooler (port 5432 on
# aws-1-<region>.pooler.supabase.com) because GitHub Actions runners are
# IPv4-only and Supabase direct connections are IPv6 by default.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC to confirm (safety gate)'
        required: true
        type: string
  schedule:
    # 02:00 SGT daily = 18:00 UTC previous day. Quiet hour for the operator.
    - cron: '0 18 * * *'

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.confirm }}" != "SYNC" ]]; then
            echo "::error::Manual trigger requires confirm input to be exactly 'SYNC'. Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Manual sync confirmed."

      - name: Install PostgreSQL 17 client
        # Supabase runs Postgres 17.6 on Pro plan as of 2026-05. pg_dump
        # requires client version >= server major. Ubuntu 24.04 only ships
        # 16 in the default repos so we pull from apt.postgresql.org.
        run: |
          sudo sh -c 'echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          # Ubuntu's postgresql-client-common wrapper picks the highest
          # *registered* major; on GHA runners postgresql-client-16 is
          # pre-installed and the wrapper picks 16. Force 17 via PATH.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version

      # Fail closed before pg_dump and, most importantly, before DROP SCHEMA.
      # Pooler URLs must identify two different Supabase projects and must
      # match the explicit repository variables. This prevents a swapped or
      # duplicated secret from ever targeting production as "staging".
      - name: Validate isolated database targets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_SUPABASE_PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/validate-db-sync-targets.mjs

      # Check both credentials up front. The previous workflow spent two
      # minutes producing a 300 MB dump before discovering that the staging
      # password was stale. These are read-only probes.
      - name: Preflight both database connections
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "SELECT 1" | grep -qx 1
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -tAc "SELECT 1" | grep -qx 1
          echo "Both database connections passed read-only preflight."

      - name: pg_dump prod (public schema, custom format)
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          pg_dump \
            --no-owner --no-acl \
            --schema=public \
            --format=custom \
            --compress=9 \
            --file=prod.dump \
            "$PROD_URL"
          ls -lh prod.dump

      - name: Reset staging public schema (drop + recreate)
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 <<'SQL'
            DROP SCHEMA IF EXISTS public CASCADE;
            CREATE SCHEMA public;
            GRANT ALL ON SCHEMA public TO postgres;
            GRANT ALL ON SCHEMA public TO anon, authenticated, service_role;
            GRANT ALL ON SCHEMA public TO public;
          SQL

      - name: Re-create prod's extensions on staging
        # DROP SCHEMA public CASCADE above also drops any extension that was
        # installed INTO the public schema (e.g. pg_trgm — a GIN index in the
        # dump needs its operator class public.gin_trgm_ops). pg_dump
        # --schema=public does NOT emit CREATE EXTENSION, so the restore would
        # fail ("operator class public.gin_trgm_ops does not exist"). Replay
        # prod's full extension list, each into the schema prod keeps it in,
        # BEFORE restoring. Idempotent (IF NOT EXISTS) and covers any extension
        # prod adds later, so the nightly sync won't break again.
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          psql "$PROD_URL" -tA -v ON_ERROR_STOP=1 -c \
            "SELECT 'CREATE EXTENSION IF NOT EXISTS ' || quote_ident(e.extname) || ' WITH SCHEMA ' || quote_ident(n.nspname) || ' CASCADE;' \
               FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace \
              WHERE e.extname <> 'plpgsql' \
              ORDER BY 1;" > extensions.sql
          echo '--- extensions to recreate on staging ---'
          cat extensions.sql
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -f extensions.sql

      - name: Restore prod dump into staging
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          # --exit-on-error stops on first failure so we don't end up with a
          # half-restored staging. --no-owner / --no-acl strips ownership
          # info (the prod and staging projects have different role names).
          pg_restore \
            --no-owner --no-acl \
            --schema=public \
            --exit-on-error \
            --dbname="$STAGING_URL" \
            prod.dump

      # A production snapshot must never carry active credentials into the
      # public staging site. Clear dashboard sessions, worker sessions/tokens,
      # and password-reset tokens before staging is reopened to testers.
      - name: Revoke copied production credentials in staging
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 <<'SQL'
            DO $cleanup$
            BEGIN
              IF to_regclass('public.user_sessions') IS NOT NULL THEN
                EXECUTE 'TRUNCATE TABLE public.user_sessions';
              END IF;
              IF to_regclass('public.worker_sessions') IS NOT NULL THEN
                EXECUTE 'TRUNCATE TABLE public.worker_sessions';
              END IF;
              IF to_regclass('public.worker_tokens') IS NOT NULL THEN
                EXECUTE 'TRUNCATE TABLE public.worker_tokens';
              END IF;
              IF to_regclass('public.password_reset_tokens') IS NOT NULL THEN
                EXECUTE 'TRUNCATE TABLE public.password_reset_tokens';
              END IF;
            END
            $cleanup$;
          SQL

      - name: ANALYZE staging (refresh planner stats after restore)
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          # pg_restore loads rows + indexes but NOT planner statistics, so the
          # first data-heavy page loads crawl (seq scans on an un-analyzed DB).
          # ANALYZE rebuilds the stats so the planner picks good plans.
          # Stats-only — never touches data.
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -c "ANALYZE;"
          echo "ANALYZE complete."

      - name: Verify staging matches prod
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          echo "=== Prod row counts ==="
          psql "$PROD_URL" -c "SELECT (SELECT COUNT(*) FROM job_cards) AS jc, (SELECT COUNT(*) FROM audit_events) AS audit, (SELECT MAX(applied_at) FROM _migrations) AS latest_migration;"
          echo "=== Staging row counts ==="
          psql "$STAGING_URL" -c "SELECT (SELECT COUNT(*) FROM job_cards) AS jc, (SELECT COUNT(*) FROM audit_events) AS audit, (SELECT MAX(applied_at) FROM _migrations) AS latest_migration;"

      # Staging can still use one owner-controlled test PIN, but neither the
      # PIN nor its hash belongs in this public repository or Actions logs.
      # STAGING_WORKER_PIN_HASH must be a 64-character lowercase SHA-256 hex.
      - name: Set private staging worker test PIN
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_WORKER_PIN_HASH: ${{ secrets.STAGING_WORKER_PIN_HASH }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          if [[ ! "$STAGING_WORKER_PIN_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::STAGING_WORKER_PIN_HASH must be a 64-character lowercase SHA-256 hash."
            exit 1
          fi
          echo "::add-mask::$STAGING_WORKER_PIN_HASH"
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -v pinhash="$STAGING_WORKER_PIN_HASH" <<'SQL'
            INSERT INTO worker_pins (worker_id, pin, updated_at, must_reset)
            SELECT id, :'pinhash', now()::text, false FROM workers
            ON CONFLICT (worker_id) DO UPDATE
              SET pin = EXCLUDED.pin, updated_at = EXCLUDED.updated_at, must_reset = false;
          SQL
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT CASE WHEN COUNT(*) > 0 THEN 1 ELSE 0 END FROM worker_pins" | grep -qx 1
          echo "Private staging worker PIN applied; no employee data was printed."
