name: Production release gate

# Production accepts only the exact commit already deployed on staging.
# This workflow validates code ancestry, version uniqueness, the public build
# manifest, the API build identity and the live staging DB migration version.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact 40-character staging commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-staging-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require staging as the production source
        if: github.event_name == 'pull_request' && github.head_ref != 'staging'
        run: |
          echo "::error::Production PRs must come from the staging branch after staging acceptance."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.staging_sha }}
          fetch-depth: 0

      - name: Validate exact staging commit and ancestry
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.staging_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character lowercase commit SHA."
            exit 1
          fi
          git fetch origin main staging --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/staging)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor origin/main "$EXPECTED_SHA"

          version=$(node -p "require('./package.json').version")
          if [ "$version" = "0.0.0" ]; then
            echo "::error::A real SemVer is required before production promotion."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/erp-v${version}" >/dev/null; then
            echo "::error::erp-v${version} already exists. Bump the version for this release."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate source release metadata
        run: npm run release:check -- --channel=staging --sha="$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.staging_sha }}
          HOOKKA_BUILD_BRANCH: staging
          HOOKKA_BUILD_SHA: ${{ github.event.pull_request.head.sha || inputs.staging_sha }}

      - name: Verify deployed staging FE, BE and DB are one release
        run: node scripts/verify-staging-release.mjs
        env:
          HOOKKA_BUILD_BRANCH: staging
          HOOKKA_BUILD_SHA: ${{ github.event.pull_request.head.sha || inputs.staging_sha }}
          STAGING_BASE_URL: https://staging.hookka-erp-testing.pages.dev
