# ---------------------------------------------------------------------------
# Secret hygiene gate — REBUILT 2026-08-14, and this is the second time.
#
# A workflow of this name was added on 2026-07-20 by the commits titled
# "security: remove embedded database credentials" (1294db69, 76687226). It was
# later deleted. Nothing replaced it.
#
# With the guard gone, the credential came back — and worse than before. The
# 2026-07-20 rotation put the NEW password into `export HOOKKA_PROD_DB_URL=…`
# example comments in three tracked scripts. When the repo was made public those
# comments went public with it, so the LIVE production database password was
# readable by anyone on GitHub until 2026-08-14.
#
# The code in all three files was correct — it read the DSN from the
# environment. The password was in the documentation above it. That is the whole
# lesson: a credential does not have to be USED by the code to be EXPOSED by it,
# and human review missed it for weeks while a 200ms scan does not.
#
# This runs on every PR and every push to main. If it is ever deleted again,
# that deletion is itself the incident.
# ---------------------------------------------------------------------------
name: Secret hygiene

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: No credentials in tracked files
        run: node scripts/check-secrets.mjs

      # The scanner only sees the current tree. This catches a secret that is
      # added and removed within the same PR — still recoverable from history,
      # so still an exposure that needs a rotation.
      - name: No credentials introduced anywhere in this PR's commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            echo "base ref not available — skipping the history check rather than passing silently"
            exit 0
          fi
          # Scan only ADDED lines in the diff, so pre-existing history does not
          # fail every unrelated PR.
          added=$(git diff "$base...HEAD" --unified=0 | grep -E '^\+' || true)
          if printf '%s' "$added" | grep -qE 'postgres(ql)?://[^:[:space:]]+:[^@[:space:]<{$]+@[^[:space:]]+'; then
            echo "::error::A postgres connection string with a password was ADDED in this PR."
            echo "The value is not printed here. Find it with:"
            echo "  git diff $base...HEAD | grep -nE 'postgres(ql)?://'"
            echo "Replace it with a placeholder, and ROTATE the credential if it was pushed."
            exit 1
          fi
          echo "no credential-shaped strings added in this PR"
