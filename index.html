<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hookka-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hookka Manufacturing ERP</title>
    <!-- PWA — TWO installable apps share this shell:
           • Office ERP (default): black-bg / white-logo icon, theme raisin.
           • Worker portal (/worker): white-bg / black-logo icon, theme olive.
         Default tags below are the office ERP; the inline script swaps them to
         the worker set when the page is under /worker, so each "Add to Home
         Screen" gets its own icon. Service worker registers from src/main.tsx. -->
    <link rel="manifest" href="/manifest-erp.webmanifest" />
    <meta name="theme-color" content="#1F1D1B" />
    <link rel="apple-touch-icon" href="/pwa-icon-erp-192.png" />
    <script>
      (function () {
        if (location.pathname.indexOf("/worker") === 0) {
          var m = document.querySelector('link[rel="manifest"]');
          if (m) m.href = "/manifest.webmanifest";
          var a = document.querySelector('link[rel="apple-touch-icon"]');
          if (a) a.href = "/pwa-icon-192.png";
          var t = document.querySelector('meta[name="theme-color"]');
          if (t) t.setAttribute("content", "#6B5C32");
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hookka" />
    <!-- JetBrains Mono: the app's code/number font (see --font-mono in
         index.css). Without this it silently fell back to the OS default
         monospace, where "0" and "O" look almost identical on document
         numbers / SO IDs. JetBrains Mono draws an unmistakable zero. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Pre-paint loading state. Lives inside #root so React's first render
         replaces it automatically — no flicker, no removeChild. The point:
         on a cold first-visit over a weak factory wifi (the owner's 2026-06-29
         report: react-vendor.js took 38 s to download), the user previously
         saw pure white until React arrived. Now they see "Loading Hookka ERP"
         immediately — same paint speed as plain HTML, ~0 bytes added. Pure
         CSS, no JS, no fonts — so it shows BEFORE the JS bundle is fetched. -->
    <div id="root">
      <div id="boot-splash" style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#FAF8F4; color:#1F1D1B; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased;">
        <div style="font-size:22px; font-weight:700; letter-spacing:0.5px; margin-bottom:18px;">Hookka Manufacturing ERP</div>
        <div style="width:36px; height:36px; border:3px solid #E2DDD8; border-top-color:#6B5C32; border-radius:50%; animation:hk-spin 0.9s linear infinite;"></div>
        <div style="margin-top:18px; font-size:12.5px; color:#8B8580;">Loading… first open may take a moment on slow Wi-Fi</div>
        <style>@keyframes hk-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
