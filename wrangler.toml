# ---------------------------------------------------------------------------
# Cloudflare Workers + Pages configuration for hookka-erp
#
# Deployment model:
#   - Vite SPA builds to ./dist → deployed to Cloudflare Pages
#   - Hono API runs as a Pages Function under ./functions/api/[[route]].ts
#     (or a separate Worker — see "Alternative" below)
#   - Supabase Postgres (via the Hyperdrive binding below) holds all
#     business data — customers, SOs, POs, job cards, inventory, etc.
#     [LEGACY] D1 was the source of truth pre-Phase 7. The binding was
#     retired in commit 7059259 (2026-04-27) and every route now flows
#     through the D1Compat → Postgres adapter wired up in worker.ts.
#
# Local dev:
#   npm run dev         # Vite dev server on 3000 (proxies /api → mock API)
#   npm run dev:worker  # wrangler dev on 8787 (Workers runtime; talks to
#                       # Supabase via DATABASE_URL in .dev.vars)
# ---------------------------------------------------------------------------

name = "hookka-erp-testing"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Pages project (SPA + Pages Functions)
pages_build_output_dir = "dist"

# NOTE: vars are defined further down at line ~229 (existing [vars] block).
# Don't duplicate them here — Pages rejects the deploy with
# "trying to redefine an already defined table" if [vars] appears twice.
# The hostname-based pickDbUrl in worker.ts uses request URL, not
# ENVIRONMENT, so we don't strictly need a per-env override anyway.

# D1 database binding — REMOVED 2026-04-27 (Phase 7 retire). All reads/
# writes flow through the D1Compat adapter to Supabase Postgres via
# Hyperdrive (see [[hyperdrive]] below). The legacy D1 instance was empty
# and had no live traffic — every route uses `c.var.DB` which is the
# Postgres adapter set in worker.ts middleware. The original D1 database
# (`hookka-erp-db`, id `f17f29b5-b511-4824-a476-34767e5d9001`) still exists
# in Cloudflare for snapshot-based rollback if needed; if you ever need
# to re-bind, copy it back from git history.

# Hyperdrive — proxies the Supabase pooler (Singapore) from Workers with
# edge connection pooling. Without this, postgres wire-protocol round trips
# blow through the Workers subrequest budget on the first query.
# Connection string stored on the Hyperdrive config itself (set at creation).
#
# Production deploys use the prod Hyperdrive id below. Preview deploys
# (any non-main branch) override this via [env.preview] further down so
# that staging tests don't touch production data — see also
# `staging-secrets.local.txt` for the staging Supabase project ref and
# the Cloudflare Pages "Choose Environment: Preview" dropdown which
# surfaces the override binding.
#
# Per-env routing (Option C, 2026-05-01): the Cloudflare Pages dashboard
# is the source of truth for which Hyperdrive each deploy uses. Production
# env binding HYPERDRIVE → hookka-erp-supabase (prod), Preview env
# binding HYPERDRIVE → hookka-erp-staging (staging). The id below is just
# the static fallback for `wrangler dev` / first-time pushes; dashboard
# overrides it per-env at deploy time.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b0fc9d10217c42bfa793b050d1abed65"

# ---------------------------------------------------------------------------
# Staging Hyperdrive (Option C, 2026-05-01).
#
# Cloudflare Pages locks dashboard binding edits whenever wrangler.toml
# defines `[[hyperdrive]]` at the top level — the dashboard tooltip on
# 2026-05-02 explicitly said so ("Bindings for this project are being
# managed through wrangler.toml"). That means we cannot have prod and
# preview Pages envs each pointing at a different Hyperdrive id from
# the dashboard alone — both envs receive the same top-level binding.
#
# Workaround: bind BOTH prod and staging Hyperdrive at the top level
# (HYPERDRIVE + HYPERDRIVE_STAGING). Worker.ts picks at runtime based
# on c.env.ENVIRONMENT — `preview` → staging, anything else → prod.
# Set ENVIRONMENT=preview on the Pages dashboard's Preview env decklist
# (Production env keeps ENVIRONMENT=production).
# ---------------------------------------------------------------------------
[[hyperdrive]]
binding = "HYPERDRIVE_STAGING"
id = "759227c0381a4a19ab7537ea48a1560f"

# SESSION_CACHE — KV for per-request hot data.  Primary use: auth session
# lookup (saves ~15ms DB round trip on every authenticated request).  Also
# used by Phase 4 for BOM / SKU / permission cache.
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "8f4c4b7ac1f142ff8378eada4602458a"

# ---------------------------------------------------------------------------
# ERP_METRICS — Cloudflare Analytics Engine dataset (Phase 6 / P6.2-P6.3).
# ---------------------------------------------------------------------------
# Sink for per-request timing + per-resource event counters. Writes are
# best-effort — every call site checks `if (env.ERP_METRICS)` before
# dispatching, so when the binding is missing (local dev without an account
# token, or during a rollback) the code simply doesn't emit. Queries run
# from /api/admin/health/kpis (P6.4) via env.ERP_METRICS.query(...).
#
# Schema (see docs/OBSERVABILITY.md for the full spec):
#   indexes:  ["{route}|{status}"]
#   blobs:    [route, status, traceparent, kind?]
#   doubles:  [dur_ms, db_dur_ms, db_count]
#
# Bindings on Pages projects require the Analytics Engine product be
# enabled on the account (free tier covers ~10M events/day). If unavailable,
# leave this commented out — the code path no-ops.
#
# Re-enabled 2026-05-27 after Wei Siang enabled Analytics Engine on the
# Cloudflare account (dash.cloudflare.com → Analytics & Logs → Analytics
# Engine → Enable). The original disable below stays as a guard rail —
# if you ever see "You need to enable Analytics Engine" in deploy logs,
# re-comment this block until AE is back on.
#
# DISABLE-WARNING (history): enabling this binding without enabling
# Analytics Engine on the account caused 30 consecutive CI deploy
# failures on 2026-04-26 ("You need to enable Analytics Engine"). The
# net effect was that prod was running stale code from before commit
# 3de901a AND the post-deploy schema-apply step was never running.
[[analytics_engine_datasets]]
binding = "ERP_METRICS"
dataset = "hookka_erp_metrics"

# ---------------------------------------------------------------------------
# TODO: Cron Trigger for dashboard materialized views.
# ---------------------------------------------------------------------------
# `migrations-postgres/9901_dashboard_mat_views.sql` creates 4 MVs that need
# periodic REFRESH.  The endpoint `POST /api/internal/refresh-mvs` (secret-
# gated by CRON_SECRET) triggers the refresh.  WHAT'S MISSING: something
# actually hitting that endpoint on a schedule.
#
# Pages Functions do NOT support `[triggers] crons = [...]` natively
# (scheduled events are Workers-only).  Three options:
#
#   1. Deploy a tiny companion Worker with `[triggers] crons = ["*/5 * * * *"]`
#      whose `scheduled()` handler does:
#        await fetch("https://<prod>/api/internal/refresh-mvs",
#                    { method:"POST", headers:{ "x-cron-secret": env.CRON_SECRET } })
#      This is the CF-native path.
#   2. External cron service (cron-job.org / EasyCron / a GitHub Action on a
#      schedule) POSTing to the refresh endpoint.  Zero infra but an external
#      dependency.
#   3. Invalidate MVs on write (add cache-invalidate calls where SO/PO/JC
#      mutations happen).  Lowest latency, most code touch points.
#
# Until one of the above ships, dashboard tiles will reflect the MV state at
# the last manual refresh — see migrations-postgres/README.md for the
# Supabase migration flow and docs/d1-retirement-plan.md ([LEGACY] now
# fully executed) for historical context.

# ---------------------------------------------------------------------------
# Phase C #3 quick-win — PO emission queue (scaffold).
# ---------------------------------------------------------------------------
# Bindings stay commented out until the admin provisions the queues:
#   wrangler queues create po-emission
#   wrangler queues create po-emission-dlq
# Then uncomment both blocks and redeploy. Producer code in
# src/api/lib/queue-po-emission.ts auto-detects the binding (gracefully
# falls back to inline notify when missing). Consumer code lives at
# src/api/queues/po-emission-consumer.ts — Pages Functions cannot host a
# queue consumer directly, so the admin will also need a sibling Worker
# to wire `default.queue` → that handler. Full runbook in
# docs/QUEUES-SETUP.md.
#
# [[queues.producers]]
# binding = "PO_EMISSION_QUEUE"
# queue = "po-emission"
#
# [[queues.consumers]]
# queue = "po-emission"
# max_batch_size = 10
# max_batch_timeout = 30
# max_retries = 3
# dead_letter_queue = "po-emission-dlq"

# ---------------------------------------------------------------------------
# File storage — moved from Cloudflare R2 to Supabase Storage
# ---------------------------------------------------------------------------
# Storage now lives on Supabase Storage (same vendor as Postgres) instead
# of R2. The Supabase Pro plan we already pay for includes 100 GB storage
# + 250 GB egress/month — comfortably covers daily pg_dump (~5 GB/mo) and
# file attachments (~3 GB/mo).
#
# Bootstrap (one-time, before deploy):
#   1. Supabase Dashboard → Storage → New bucket → name "hookka-files",
#      visibility = Private. (See docs/DR-RUNBOOK.md "Storage bootstrap".)
#   2. wrangler secret put SUPABASE_SERVICE_KEY    # service_role key
#   3. SUPABASE_PROJECT_REF goes in [vars] below (it's the public slug
#      from the supabase.co URL — not a secret).
#
# Helper in src/api/lib/supabase-storage.ts raises
# `SupabaseStorageNotConfiguredError` when either env var is missing, and
# routes that need files (src/api/routes/files.ts) return 503 instead of
# crashing.

# ---------------------------------------------------------------------------
# Phase C #7 — Daily backup cron trigger (scaffold).
# ---------------------------------------------------------------------------
# Uncomment after Supabase Storage bucket "hookka-files" is provisioned.
# Runs the src/api/cron/daily-backup.ts handler, which writes a logical
# dump to: <SUPABASE_PROJECT_REF>.supabase.co/storage/v1/object/
# hookka-files/backups/supabase/<date>.json.gz.
# Pages Functions does not support `[triggers] crons`; you'll need to
# move this entry to a sibling Worker project. See docs/DR-RUNBOOK.md.
#
# [triggers]
# crons = ["0 18 * * *"]   # 02:00 SGT daily (UTC+8)

# Runtime env vars — override per environment (dev/preview/prod) on the
# Cloudflare dashboard or via wrangler secret put.
#
# NOTE: RESEND_API_KEY is intentionally NOT listed here — secrets belong in
# .dev.vars locally and `wrangler secret put <NAME>` in prod.
#
# Phase B.3 / C.6 — Google Workspace OAuth + TOTP 2FA. Required for OAuth
# login to work; until set, /api/auth/oauth/google/start returns 503.
# See docs/AUTH-OAUTH-SETUP.md for the full setup walkthrough.
#   PUBLIC vars (set here or via dashboard):
#     OAUTH_GOOGLE_CLIENT_ID
#     OAUTH_GOOGLE_REDIRECT_URI
#     OAUTH_GOOGLE_HOSTED_DOMAIN     — optional; lock to one Workspace tenant
#   SECRETS (wrangler secret put …):
#     OAUTH_GOOGLE_CLIENT_SECRET
#     JWT_SECRET                     — HMAC secret for OAuth CSRF state token
[vars]
ENVIRONMENT = "production"

# CF_ACCOUNT_ID — the missing half of the /admin/health live-data wiring.
#
# Querying Analytics Engine is an HTTP call to
#   https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT_ID}/analytics_engine/sql
# so the route needs BOTH the account id and AE_QUERY_TOKEN. The token was
# set as a Pages secret long ago, the ERP_METRICS binding has been writing
# data points on every request since P6.2 — but this id was never set, so
# the fetch could not even be addressed and /api/admin/health/kpis silently
# fell back to `_mock: true`. Net effect: the System Health dashboard has
# been reporting "All systems normal · No 5xx" off deterministic mocks,
# i.e. monitoring nothing, while looking green. Diagnosed 2026-08-01 via
# GET /api/admin/health/kpis-diag (CF_ACCOUNT_ID_set:false, everything
# else true).
#
# An account id is NOT a credential — it appears in every dashboard URL,
# and this file already carries KV namespace ids, the D1 database id and
# the Sentry DSN on the same reasoning. The actual secret (AE_QUERY_TOKEN)
# stays in Pages secrets and is deliberately NOT here.
#
# Kept in wrangler.toml rather than set by hand in the Pages dashboard so
# it is self-healing: a rebuilt project, a new environment or a fresh
# clone gets it from the next deploy instead of silently going back to
# mock data. `wrangler pages secret put` was tried first and is refused by
# an OAuth login (API error 10000), which is another reason not to rely on
# a manual step here.
CF_ACCOUNT_ID = "816e457307d7fa0491c2a08a72ad5dcd"
# 2026-05-27 — Custom-domain cutover to erp.hookka.com. Multi-origin
# allowlist so BOTH the new prod domain AND the legacy pages.dev URL
# work in parallel. Once everyone (employees, integrations, bookmarks)
# is on the new URL, we can drop hookka-erp-testing.pages.dev from
# the list. The pages.dev URL itself never goes away — CF Pages
# permanently serves it — so dropping it from CORS just means
# browser-side fetches from that origin start failing CORS while
# server-to-server traffic (cron, Apps Script webhook) keeps working.
# CORS code parses the comma-separated list — see src/api/worker.ts.
API_CORS_ORIGIN = "https://erp.hookka.com,https://hookka-erp-testing.pages.dev"
APP_URL = "https://erp.hookka.com"
# 2026-05-27 — Cut over from Resend (houzscentury.com) to Brevo (hookka.com).
# Brevo Free tier supports the unlimited-domain need; Resend free was 1
# domain only. The pluggable sender in src/api/lib/email.ts (sendMail)
# auto-picks Brevo when BREVO_API_KEY is set (wrangler secret), falls back
# to Resend otherwise. The FROM address below is read by every email
# path (auth/forgot-password, supplier-PO, invite). Once Brevo finishes
# its background domain authentication (~5-15 min from DNS-record-add,
# can take up to 48h max), all outbound mail comes from @hookka.com.
# 2026-06-11 — Display name "Hookka Industries" (owner: matches the formal
# company name customers know; was "Hookka Manufacturing ERP"). Same
# verified address, so no re-authentication needed on Brevo.
RESEND_FROM_EMAIL = "Hookka Industries <noreply@hookka.com>"
# 2026-05-31 — Per-user daily cap on AI Assistant questions. Each question is
# a full Claude call plus a multi-step tool loop, so worst case ~RM 0.5-1 a
# question. This bounds the worst-case daily spend per user (applies to every
# user including SUPER_ADMIN). Read by src/api/lib/assistant-daily-quota.ts;
# code defaults to 10 if this is unset/blank/invalid. Set "0" to disable the
# cap. Resets at Singapore midnight (UTC+8).
ASSISTANT_DAILY_LIMIT = "10"
# Temporary kill-switch for the Hookka AI assistant — "false" turns it off; set "true" or remove to re-enable.
ASSISTANT_ENABLED = "true"
# 2026-05-27 — Daily reports (efficiency / schedule / overdue). Comma-
# separated list of recipients for cron-pushed reports. Leave unset to
# auto-target every active SUPER_ADMIN user (the report code queries the
# users table when this is empty). Set here to override (e.g. add a
# distribution list address that isn't a dashboard user).
# DAILY_REPORT_RECIPIENTS = "weisiang329@gmail.com"
# Sentry — Cloudflare Workers DSN. DSNs are public-safe per Sentry docs:
# they grant event-submission only, never data read access. Keeping the
# value in [vars] (rather than `wrangler secret put`) means every deploy
# guarantees the worker still reports — no risk of someone forgetting to
# re-set the secret on a fresh worker. Read by src/api/worker.ts onError
# → reportWorkerError() (which dynamic-imports toucan-js).
SENTRY_DSN = "https://9ad06534a79eed8df457becbe2a2244f@o4511302465814528.ingest.us.sentry.io/4511302502907904"
# Supabase Storage — public project slug (the segment before .supabase.co).
# Not a secret. The matching service_role key is set via
# `wrangler secret put SUPABASE_SERVICE_KEY` and never appears here.
# Leave this blank in dev / local — the helper degrades to 503 cleanly.
# NOTE: SUPABASE_PROJECT_REF is ALREADY set on the Cloudflare Pages dashboard
# (prod). Do NOT also define it here — Cloudflare rejects the deploy with
# "Binding name 'SUPABASE_PROJECT_REF' already in use" (caused the 2026-05-30
# deploy failure). Keep it commented; the worker reads it from the dashboard.
# SUPABASE_PROJECT_REF = "vpwdqtsxexpiqxzweivd"
# Uncomment + fill once the Google Cloud Console step is done. Empty values
# keep the OAuth route returning 503 (fails closed, see auth-oauth.ts).
# OAUTH_GOOGLE_CLIENT_ID = ""
# OAUTH_GOOGLE_REDIRECT_URI = "https://hookka-erp-testing.pages.dev/api/auth/oauth/google/callback"
# OAUTH_GOOGLE_HOSTED_DOMAIN = "hookka.com"

# ---------------------------------------------------------------------------
# Google Sheets bidirectional sync — see docs/SHEETS-SYNC.md.
# ---------------------------------------------------------------------------
# Two secrets + one public id. Until all three are set, every sheets-sync
# helper silently no-ops and the webhook + backfill routes return 503 — the
# build is safe to deploy without them.
#
# Provision the SA + HMAC secret via:
#   wrangler pages secret put GOOGLE_SHEETS_SA_KEY    # full SA JSON, stringified
#   wrangler pages secret put SHEETS_SYNC_SECRET      # openssl rand -hex 32
# Then uncomment the public spreadsheet id below and redeploy.
#
# GOOGLE_SHEETS_SA_KEY = ...   # see docs/SHEETS-SYNC.md
# SHEETS_SYNC_SECRET = ...
# SHEETS_SPREADSHEET_ID = "1hDGUYeKuWHpCXKrZptFI2eIKh9yNdhw7JeKbTjxT-x8"
